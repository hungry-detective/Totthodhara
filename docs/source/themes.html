<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wall { height: 600px; padding: 56px 0 0; }
header { text-align: center; margin-bottom: 34px; position: relative; z-index: 1; }
header h2 { font-size: 36px; margin-top: 12px; }
.row { position: relative; z-index: 1; margin-bottom: 22px; }
.row label { display: flex; justify-content: space-between; padding: 0 22px 8px; font-size: 13.5px; color: var(--muted); }
.row label b { color: var(--ink); font-weight: 600; }
.split { height: 1px; background: var(--line); margin: 30px 22px 26px; position: relative; z-index: 1; }
</style></head><body>
<div class="wall">
  <header><div class="eyebrow">Themes &amp; sizes</div><h2>Looks native next to your taskbar</h2></header>
  <div class="row"><label><b>Dark</b><span>follows Windows in System mode</span></label><img class="bar" src="bar_dark.png" width="1366" height="30" alt=""></div>
  <div class="row"><label><b>Light</b><span>switches live when Windows does</span></label><img class="bar" src="bar_light.png" width="1366" height="30" alt=""></div>
  <div class="split"></div>
  <div class="row"><label><b>Small</b><span>26 px</span></label><img class="bar" src="bar_dark_small.png" width="1366" height="26" alt=""></div>
  <div class="row"><label><b>Medium</b><span>30 px</span></label><img class="bar" src="bar_dark.png" width="1366" height="30" alt=""></div>
  <div class="row"><label><b>Large</b><span>36 px — text, icons and gaps scale together</span></label><img class="bar" src="bar_dark_large.png" width="1366" height="36" alt=""></div>
</div>
</body></html>
